[project]
name = "logparse"
version = "0.2.0"
description = "Tiny CLI tool for parsing nginx access logs"
requires-python = ">=3.9"
authors = [{ name = "iximy" }]

[project.scripts]
logparse = "logparse.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
